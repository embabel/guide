name: Export Seed Database

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * *' # Daily at 5am UTC (before hub docs workflow at 6am)

jobs:
  # The seed for Neo4j: the hub's all-in-one Docker image (embabel/hub on Docker Hub) bundles Neo4j and loads it at start.
  # Prod Guide runs on Postgres and takes the seed below.
  export-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      neo4j:
        image: neo4j:2025.10.1-community-bullseye
        env:
          NEO4J_AUTH: neo4j/testpassword
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: apoc.*
        ports:
          - 7474:7474
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p testpassword 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout guide
        uses: actions/checkout@v4

      - name: Ingest into Neo4j
        uses: ./.github/actions/ingest
        with:
          java-options: -DNEO4J_URI=bolt://localhost:7687 -DNEO4J_USERNAME=neo4j -DNEO4J_PASSWORD=testpassword
          artifactory-servers: ${{ secrets.EMBABEL_ARTIFACTORY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      # The seed is content alone. Guide makes app nodes on start (the bot, the anonymous user, the system personas),
      # which the app owns on the target. Exported, the seed's bot collided with the target's, so the hub's cleanup
      # deleted the target's bot each apply, cutting its system personas loose: Guide then made 7 more every time.
      # Drivine's schema record stays: the hub's cleanup replaces the target's with it.
      - name: Remove app nodes before export
        run: |
          echo "Removing app nodes from export (owned by the app on the target, not the seed)..."
          RESULT=$(curl -sf \
            -u "neo4j:testpassword" \
            -H "Content-Type: application/json" \
            "http://localhost:7474/db/neo4j/tx/commit" \
            -d '{"statements": [{"statement": "MATCH (n) WHERE NOT n:ContentElement AND NOT n:_DrivineSchema DETACH DELETE n RETURN count(n) AS removed"}]}')
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Removed {d[\"results\"][0][\"data\"][0][\"row\"][0]} app nodes')"

      - name: Tag all nodes with managedBy
        run: |
          echo "Tagging all nodes with managedBy=embabel..."
          RESULT=$(curl -sf \
            -u "neo4j:testpassword" \
            -H "Content-Type: application/json" \
            "http://localhost:7474/db/neo4j/tx/commit" \
            -d '{"statements": [{"statement": "MATCH (n) SET n.managedBy = '\''embabel'\'' RETURN count(n) AS tagged"}]}')
          echo "$RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(f'Tagged {d[\"results\"][0][\"data\"][0][\"row\"][0]} nodes')"

      - name: Export seed database
        run: |
          set -e
          mkdir -p seed-output

          NEO4J_URL="http://localhost:7474"
          NEO4J_USER="neo4j"
          NEO4J_PASS="testpassword"

          echo "Exporting Neo4j database..."

          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -u "${NEO4J_USER}:${NEO4J_PASS}" \
            -H "Content-Type: application/json" \
            "${NEO4J_URL}/db/neo4j/tx/commit" \
            -d '{
              "statements": [{
                "statement": "CALL apoc.export.cypher.all(null, {streamStatements:true, separateFiles:true, format:\"cypher-shell\", useOptimizations:{type:\"UNWIND_BATCH\", unwindBatchSize:20}}) YIELD schemaStatements, nodeStatements, relationshipStatements, cleanupStatements RETURN schemaStatements, nodeStatements, relationshipStatements, cleanupStatements"
              }]
            }')

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Neo4j returned HTTP $HTTP_CODE"
            echo "$BODY" | python3 -m json.tool 2>/dev/null || echo "$BODY"
            exit 1
          fi

          ERRORS=$(echo "$BODY" | python3 -c "import sys,json; errs=json.load(sys.stdin).get('errors',[]); print('\n'.join(e.get('message','') for e in errs))" 2>/dev/null)
          if [ -n "$ERRORS" ]; then
            echo "ERROR: Neo4j query failed:"
            echo "$ERRORS"
            exit 1
          fi

          # Extract schema with IF NOT EXISTS
          echo "$BODY" | python3 -c "
          import sys, json, re
          data = json.load(sys.stdin)
          rows = data['results'][0]['data']
          lines = []
          for row in rows:
              schema = row['row'][0]
              if schema:
                  for line in schema.splitlines():
                      s = line.strip()
                      if not s or s.startswith('//') or s.startswith(':'):
                          continue
                      if s.upper().startswith('CALL '):
                          continue
                      s = re.sub(r'^(CREATE\s+(?:FULLTEXT\s+|RANGE\s+)?INDEX)\s+(\S+)\s+FOR\b',
                                  r'\1 \2 IF NOT EXISTS FOR', s)
                      s = re.sub(r'^(CREATE\s+(?:FULLTEXT\s+|RANGE\s+)?INDEX)\s+(FOR)\b',
                                  r'\1 IF NOT EXISTS \2', s)
                      s = re.sub(r'^(CREATE\s+CONSTRAINT)\s+(\S+)\s+FOR\b',
                                  r'\1 \2 IF NOT EXISTS FOR', s)
                      lines.append(s)
          lines.append('CALL db.awaitIndexes(300);')
          print('\n'.join(lines))
          " > seed-output/01-schema.cypher

          # Extract data (nodes, relationships, cleanup)
          echo "$BODY" | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          rows = data['results'][0]['data']
          for row in rows:
              schema, nodes, rels, cleanup = row['row']
              for part in [nodes, rels, cleanup]:
                  if part:
                      print(part)
          " > seed-output/02-graph.cypher

          echo "Schema: $(wc -l < seed-output/01-schema.cypher) lines"
          echo "Graph:  $(wc -l < seed-output/02-graph.cypher) lines, $(du -h seed-output/02-graph.cypher | cut -f1)"

      - name: Upload seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-files
          path: seed-output/
          retention-days: 30

      - name: Stop guide
        if: always()
        run: |
          if [ -n "$GUIDE_PID" ]; then
            kill $GUIDE_PID 2>/dev/null || true
          fi
  # The seed for Postgres, which prod Guide runs on: the content rows, and seed/postgres/apply.sql to load them.
  export-seed-postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: guide
          POSTGRES_PASSWORD: brahmsian
          POSTGRES_DB: guide
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U guide -d guide"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: guide
      PGPASSWORD: brahmsian
      PGDATABASE: guide

    steps:
      - name: Checkout guide
        uses: actions/checkout@v4

      - name: Ingest into Postgres
        uses: ./.github/actions/ingest
        with:
          java-options: -Dspring.profiles.active=postgres
          artifactory-servers: ${{ secrets.EMBABEL_ARTIFACTORY }}
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Export seed database
        run: scripts/export-postgres-seed.sh seed-output

      - name: Upload seed artifact
        uses: actions/upload-artifact@v4
        with:
          name: seed-postgres
          path: seed-output/
          retention-days: 30

      - name: Stop guide
        if: always()
        run: |
          if [ -n "$GUIDE_PID" ]; then
            kill $GUIDE_PID 2>/dev/null || true
          fi

  # Both seeds are ready: the hub's update-seed downloads them from this run and opens one pull request with them.
  notify-hub:
    needs: [export-seed, export-seed-postgres]
    runs-on: ubuntu-latest
    steps:
      - name: Trigger hub update
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.HUB_DISPATCH_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'embabel',
              repo: 'embabel-hub',
              event_type: 'seed-updated',
              client_payload: {
                run_id: String(context.runId),
                repo: context.repo.owner + '/' + context.repo.repo
              }
            })
            console.log('Dispatched seed-updated event to embabel/embabel-hub')
